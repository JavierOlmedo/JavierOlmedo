name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/blog-posts.yml"]
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with latest blog posts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r assets/requirements.txt

      # Reads https://hackpuntes.com/posts/index.xml (see [posts] in
      # assets/profile.toml) and rebuilds the Recent Posts rows.
      - run: python assets/build.py --fetch-posts

      - name: Commit posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No new posts"
            exit 0
          fi
          git commit -m "📝 Update latest blog posts"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
