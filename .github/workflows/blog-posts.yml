name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/blog-posts.yml"]
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Section feed: only posts, not /projects/ or /tools/ pages.
          feed_list: "https://hackpuntes.com/posts/index.xml"
          max_post_count: 6
          readme_path: README.md
          comment_tag_name: BLOG-POST-LIST
          template: '<tr><td><a href="$url">$title</a></td><td align="right"><code>$date</code></td></tr>$newline'
          date_format: "UTC:d mmm yyyy"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
