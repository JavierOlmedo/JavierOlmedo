# Profile data for the Hackpuntes Dark README.
# Edit this file, then run:
#   pip install -r assets/requirements.txt && python assets/build.py
# to regenerate assets/dist/*.svg and the generated blocks of README.md.
# The "Profile assets" workflow fails if you forget.

[profile]
name = "Javier Olmedo"
github = "JavierOlmedo"
tagline = "Senior Offensive Security Specialist"
prompt = "javierolmedo@hackpuntes:~$"
# Phrases typed in the header, one after another. {cves} = number of CVEs.
typed = [
  "Hey, I'm Javier Olmedo 👋",
  "OSCP · OSWE · OSEP · CRTO · {cves} CVEs",
  "Author of Hackpuntes Blog · CTF Player",
]

# Rows of the `whoami` terminal card (emoji, key, value).
whoami = [
  ["🛡️", "role", "Senior Offensive Security Specialist"],
  ["📍", "base", "Toledo, Spain · UTC+1"],
  ["🎯", "focus", "Red Team · Active Directory · Web & Mobile pentesting · Reversing"],
  ["🧰", "arsenal", "Burp Suite · Frida · Nmap · custom tooling"],
  ["💻", "code", "Python · Go · C# · PowerShell · PHP · JavaScript"],
  ["🐞", "research", "{cves} CVEs · Exploit-DB author"],
  ["✍️", "blog", "hackpuntes.com · CTF write-ups & red team notes"],
]

# Navigation pills under the header (label, url, icon in assets/icons/).
links = [
  ["hackpuntes.com", "https://hackpuntes.com", "hackpuntes"],
  ["linkedin", "https://www.linkedin.com/in/jjavierolmedo/", "linkedin"],
  ["hackthebox", "https://app.hackthebox.com/profile/37005", "hackthebox"],
  ["exploit-db", "https://www.exploit-db.com/?author=9580", "exploit-db"],
  # 0day.today now redirects to an unrelated casino site. To re-enable it,
  # uncomment the line and add an icon as assets/icons/0day.svg.
  # ["0day.today", "https://0day.today/author/33736", "0day"],
  ["medium", "https://medium.com/@javierolmedo", "medium"],
  ["x", "https://x.com/jjavierolmedo", "x"],
]

# Section titles: key = [emoji, title, right-hand note]. {cves} = number of CVEs.
[titles]
whoami = ["🧑‍💻", "whoami", ""]
certs = ["🎓", "Certifications", "click a badge to verify"]
projects = ["🛠️", "Projects & Tools", "hackpuntes.com/projects"]
cves = ["🔐", "CVEs", "{cves} published"]
posts = ["📝", "Recent Posts", "hackpuntes.com/posts"]
summary = ["📊", "Profile Summary", "github activity"]
activity = ["📈", "Activity", "contribution graph"]

