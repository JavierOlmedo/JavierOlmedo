# Profile data for the Hackpuntes Dark README.
# Edit this file and run `python assets/build.py` (or push and let the
# "Build profile assets" workflow do it) to regenerate assets/dist/*.svg
# and the generated sections of README.md.

[profile]
name = "Javier Olmedo"
tagline = "Senior Offensive Security Specialist"
prompt = "javierolmedo@hackpuntes:~$"
typed = "OSCP · OSWE · OSEP · CRTO · {cves} CVEs"

# Rows of the `whoami` terminal card (emoji, key, value).
whoami = [
  ["🛡️", "role", "Senior Offensive Security Specialist"],
  ["📍", "base", "Toledo, Spain · UTC+1"],
  ["🎯", "focus", "Red Team · Active Directory · Web & Mobile pentesting · Reversing"],
  ["🧰", "arsenal", "Burp Suite · Frida · Nmap · custom tooling"],
  ["💻", "code", "Python · Go · C# · PowerShell · PHP · JavaScript"],
  ["🐞", "research", "{cves} CVEs · Exploit-DB author"],
  ["✍️", "blog", "hackpuntes.com · CTF write-ups & red team notes"],
]

# Navigation pills under the header (label, url).
links = [
  ["hackpuntes.com", "https://hackpuntes.com"],
  ["writeups", "https://hackpuntes.com/writeups/"],
  ["linkedin", "https://www.linkedin.com/in/jjavierolmedo/"],
  ["x", "https://x.com/jjavierolmedo"],
  ["hackthebox", "https://app.hackthebox.com/profile/37005"],
  ["exploit-db", "https://www.exploit-db.com/?author=9580"],
  ["youtube", "https://www.youtube.com/channel/UCBYLZkWHGMYo12nAD_HMRJw"],
]

# Section titles: key = [emoji, title, right-hand note]. {cves} = number of CVEs.
[titles]
whoami = ["🧑‍💻", "whoami", ""]
certs = ["🎓", "Certifications", "click a badge to verify"]
projects = ["🛠️", "Projects & Tools", "hackpuntes.com/projects"]
cves = ["🔐", "CVEs", "{cves} published"]
posts = ["📝", "Recent Posts", "hackpuntes.com/posts"]
activity = ["📈", "Activity", "contribution graph"]

# Project / tool cards (2 per row in the README).
[[projects]]
name = "Hackpuntes for Obsidian"
tags = "project · CSS · Obsidian"
url = "https://hackpuntes.com/projects/obsidian-hackpuntes-theme/"
desc = "This blog's look as an Obsidian theme: teal accent, glowing headings and JetBrains Mono. Listed in the official community directory."

[[projects]]
name = "RedTeam Command Generator"
tags = "tool · web"
url = "https://hackpuntes.com/tools/redteam-command-generator/"
desc = "Like revshells.com / WADComs, but for Active Directory and red teaming: enter the target once and every command fills itself in."

[[projects]]
name = "ipdiscover"
tags = "project · Go · CLI"
url = "https://hackpuntes.com/projects/ipdiscover/"
desc = "Concurrent domain-to-IP resolver for recon: turn hundreds of domains into a clean IP list before nmap or a mass scanner."

[[projects]]
name = "Ultimate CMS Wordlists"
tags = "project · wordlists"
url = "https://hackpuntes.com/projects/ultimate-cms-wordlists/"
desc = "CMS-specific fuzzing dictionaries for WordPress, Joomla, Drupal and TYPO3: paths, plugins, themes and sensitive files."

[[projects]]
name = "CVSS 4.0 Calculator"
tags = "tool · web"
url = "https://hackpuntes.com/tools/cvss-calculator/"
desc = "CVSS v4.0 scoring with FIRST.org's official engine. Every metric explained, vector stored in the URL to share."

[[projects]]
name = "OWASP Risk Calculator"
tags = "tool · web"
url = "https://hackpuntes.com/tools/owasp-risk-calculator/"
desc = "OWASP Risk Rating Methodology: tune the 16 factors and get likelihood, impact, overall severity and a radar chart."

